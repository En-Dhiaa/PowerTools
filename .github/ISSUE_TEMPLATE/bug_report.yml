name: Bug Report
description: Create a report to help us improve PowerTool Extended Edition
labels: ["Issue-Bug", "Triage-Needed"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **PowerTool Extended Edition** (Developed by En-Dhiaa).
        > **Privacy Warning:** Never paste passwords, private clipboard content, sensitive translated text, or proprietary keys into this report.
  - type: input
    id: version
    attributes:
      label: PowerTool Edition & Version
      placeholder: "e.g. PowerTool Extended Edition v0.88.0"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Windows Version & Architecture
      placeholder: "e.g. Windows 11 23H2 (Build 22631.4317) x64"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Affected Utility / Subsystem
      options:
        - "Offline Translator"
        - "Keyboard Layout Converter"
        - "PowerTool Runner / System Tray"
        - "Settings UI"
        - "FancyZones"
        - "PowerToys Run"
        - "Keyboard Manager"
        - "Quick Accent"
        - "Text Extractor"
        - "Advanced Paste"
        - "Awake"
        - "Always on Top"
        - "Other / General"
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Explain step by step how to reproduce the issue.
      placeholder: |
        1. Select text in Notepad
        2. Press shortcut Ctrl+Alt+T
        3. See behavior
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually occurred? (Include non-sensitive error messages if available)
    validations:
      required: true
  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Screenshots or Diagnostic Logs (Optional)
      description: Drag and drop sanitized screenshots or log extracts. Ensure no sensitive or personal data is shown.
