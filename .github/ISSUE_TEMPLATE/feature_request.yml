name: Feature Request
description: Propose an idea or enhancement for PowerTool Extended Edition
labels: ["Idea-New Feature", "Triage-Needed"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement or new productivity feature for **PowerTool Extended Edition** (Developed by En-Dhiaa).
  - type: textarea
    id: feature_summary
    attributes:
      label: Feature Summary
      description: A concise summary of the requested feature or capability.
    validations:
      required: true
  - type: textarea
    id: problem_statement
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of the limitation or workflow gap you are experiencing.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Describe the solution you'd like
      description: How should this feature work in PowerTool? (Shortcuts, UI controls, settings, etc.)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions considered
      description: Any alternative workarounds or tools you currently use.
